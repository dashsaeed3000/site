[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = INFO
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
[alembic]
# Path to your migrations folder
script_location = migrations
# Database URL is read from DB_URI environment variable or .env file
# This value is only used as a fallback if DB_URI is not set
# The .env file should contain: DB_URI=mysql+pymysql://root:123456@172.30.94.74:3306/maten
sqlalchemy.url = mysql+pymysql://root:123456@172.30.94.74:3306/maten
